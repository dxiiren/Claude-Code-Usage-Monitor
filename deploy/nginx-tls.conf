# HTTPS in front of the Account Manager (docker-compose.tls.yml). The app itself is published
# on loopback only; this is the one port the network sees.
server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/ssl/tls.crt;
    ssl_certificate_key /etc/ssl/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Plain http:// typed at the https port: nginx answers 497 -> send the browser to https.
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 1m;

    location / {
        proxy_pass http://claude-usage:47291;
        proxy_http_version 1.1;
        # host:port as typed: the app checks it against ACCTMGR_PUBLIC_ORIGIN.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # The app rate-limits sign-in per CF-Connecting-IP when ACCTMGR_TRUST_PROXY=1. Behind this
        # proxy every request would otherwise come from nginx's address, so pass the real client.
        # Overwrites anything the client sent, so it cannot be spoofed.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 90s;
    }
}
