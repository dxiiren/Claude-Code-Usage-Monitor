name: Tests

# Every suite that `just test` runs locally: Rust unit tests, Account Manager unit tests,
# Account Manager end-to-end tests (stubbed Claude CLI), and a parse check of the
# PowerShell kit. Windows runner: the widget and the kit are Windows-only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --release -- -D warnings
      # The two skipped window tests fail identically on the untouched upstream commit
      # (79a0b92) -- pre-existing, not caused by this fork. Remove the skips once upstream fixes them.
      - name: Unit tests
        run: cargo test --locked -- --skip detaching_a_child_never_exposes_parent_relative_coordinates_as_a_popup --skip docking_rebinds_layered_surface_only_when_parent_changes

  web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Generates .svelte-kit/tsconfig.json, which vitest's tsconfig extends.
      - run: npx svelte-kit sync
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: End-to-end tests (local mode)
        run: npm run test:e2e
      - name: End-to-end tests (server mode)
        run: npx playwright test -c playwright.server.config.ts

  docker:
    # The server image: builds, refuses to start without a password, serves /healthz and
    # the login redirect, and ships a working Claude Code CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t claude-usage:ci web
      - name: Refuses to start without a password
        run: |
          if docker run --rm claude-usage:ci; then echo "started without a password"; exit 1; fi
      - name: Serves health + login redirect, CLI present
        run: |
          docker run -d --name cu -p 127.0.0.1:47291:47291 \
            -e ACCTMGR_ADMIN_PASSWORD=ci-only-password -e ACCTMGR_PUBLIC_ORIGIN=http://127.0.0.1:47291 claude-usage:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:47291/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47291/)" = "303"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47291/api/v1/widget)" = "401"
          docker exec cu claude --version
          docker rm -f cu

  kit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell kit parses (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @('setup.ps1', 'install.ps1', 'kit/UsageKit.psm1')) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "$f : $($_.Message)" }; $bad++ } else { Write-Host "[OK] $f" }
          }
          Import-Module ./kit/UsageKit.psm1 -DisableNameChecking
          $missing = @('Install-MonitorRelease', 'Start-Manager', 'Stop-Manager', 'Enable-Startup', 'New-Shortcuts') |
            Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) }
          if ($missing) { Write-Host "Missing exports: $missing"; $bad++ }
          if ($bad) { exit 1 }
      # `just` launches Windows PowerShell 5.1 from a pwsh 7 parent, which inherits pwsh's
      # PSModulePath and breaks autoloading of built-in modules unless the kit repairs it.
      - name: Kit works in PowerShell 5.1 launched from pwsh 7
        shell: pwsh
        run: |
          $out = powershell.exe -NoProfile -Command "Import-Module ./kit/UsageKit.psm1 -DisableNameChecking; [void](Get-FileHash ./setup.ps1); [void](Get-CimInstance Win32_OperatingSystem); 'KIT-OK'"
          $out
          if (($out -join '') -notmatch 'KIT-OK') { exit 1 }
